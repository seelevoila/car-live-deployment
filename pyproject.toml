[project]
name = "car-live-deployment"
version = "0.1.0"
description = "Local automotive livestream assistant with RAG, GPT-SoVITS speech, and optional Live2D"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "python-multipart==0.0.20",
  "pydantic-settings==2.10.1",
  "python-docx==1.2.0",
  "PyMuPDF==1.26.3",
  "httpx==0.28.1",
  "onnxruntime==1.23.2",
  "tokenizers==0.22.2",
  "faiss-cpu==1.13.2",
  "rank-bm25==0.2.2",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
]

[tool.uv]
package = false
